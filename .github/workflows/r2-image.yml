name: Build LANraragi R2 image
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
  packages: write
concurrency:
  group: r2-image-${{ github.ref }}
  cancel-in-progress: true
jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - name: Choose lowercase image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v4
      - name: Build native image for checks
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: lanraragi-r2:check
          cache-from: type=gha
      - name: Check Perl configuration and browser scripts
        run: |
          docker run --rm --entrypoint /bin/sh lanraragi-r2:check -c 'cd /home/koyomi/lanraragi && perl -Mlocal::lib=/home/koyomi/perl5 -Ilib -c lib/LANraragi/Controller/R2Settings.pm'
          docker run --rm --entrypoint /bin/sh -v "$PWD/tests:/checks:ro" lanraragi-r2:check -c 'cd /home/koyomi/lanraragi && perl -Mlocal::lib=/home/koyomi/perl5 -Ilib /checks/r2-settings.t'
      - name: Check settings JavaScript
        run: docker run --rm -v "$PWD:/code:ro" -w /code node:22-alpine node --check public/js/r2-settings.js
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha
      - name: Publish both CPU architectures
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
